name: build-windows

# 手动触发，或 push v* tag 时构建（与 build-macos 同一套约定）。
# 产物：便携版 WorkCalf.exe + 安装版 WorkCalf-Setup.exe，挂到 GitHub Release，
# 文件名直接用官网 download/ 约定的固定名，同步脚本拉取后无需改名。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # tag 触发时把 exe 挂到 GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install -g "@tauri-apps/cli@^2"

      # NSIS runner 镜像自带，不用装；不做代码签名（官网下载页已说明 SmartScreen 提示）
      - name: Build bundles
        run: tauri build --bundles nsis

      - name: Collect exe
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/workcalf.exe WorkCalf.exe
          Copy-Item (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe).FullName WorkCalf-Setup.exe

      - name: Upload exe (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WorkCalf-windows
          path: |
            WorkCalf.exe
            WorkCalf-Setup.exe
          if-no-files-found: error

  # tag 触发时把 exe 挂到 GitHub Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          overwrite: true
          fail_on_unmatched_files: true
