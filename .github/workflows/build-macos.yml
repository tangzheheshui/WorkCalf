name: build-macos

# 手动触发，或 push v* tag 时构建。
# 产物：两个 dmg（Apple Silicon / Intel 各一个），到对应 run 的 Artifacts 里下载。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # tag 触发时把 dmg 挂到 GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64      # Apple Silicon（M 系列）
          - target: x86_64-apple-darwin
            arch: x86_64     # Intel
    # 两个目标都在 Apple Silicon runner 上交叉编译：x86_64 目标不需要 Rosetta，
    # 也不依赖已陆续下线的 Intel 版 runner。
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build app
        run: tauri build --target ${{ matrix.target }} --bundles app

      # 不签名的 app 带 quarantine 会被 Gatekeeper 判"已损坏"（Apple Silicon 内核直接拒绝启动），
      # ad-hoc 签名后用户右键 → 打开即可通过；无需开发者证书。
      - name: Ad-hoc sign
        run: codesign --force --deep -s - "src-tauri/target/${{ matrix.target }}/release/bundle/macos/WorkCalf.app"

      # 不用 tauri 自带 bundle_dmg（依赖 Finder AppleScript，无头环境会超时），hdiutil 直压。
      # 文件名直接用官网 download/ 约定的固定名，服务器拉取后无需改名。
      - name: Pack dmg
        run: |
          STAGE=$(mktemp -d)
          cp -R "src-tauri/target/${{ matrix.target }}/release/bundle/macos/WorkCalf.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          if [ "${{ matrix.arch }}" = "arm64" ]; then NAME=WorkCalf-mac-arm64.dmg; else NAME=WorkCalf-mac-x64.dmg; fi
          hdiutil create -volname WorkCalf -srcfolder "$STAGE" -format UDZO -fs HFS+ -ov -o "$NAME"

      - name: Upload dmg (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WorkCalf-macos-${{ matrix.arch }}
          path: WorkCalf-mac-*.dmg
          if-no-files-found: error

  # tag 触发时把两个 dmg 挂到 GitHub Release：无需登录即可下载，也方便部署脚本取包
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.dmg
          overwrite: true
          fail_on_unmatched_files: true
