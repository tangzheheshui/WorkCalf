name: build-macos

# 手动触发，或 push v* tag 时构建。
# 产物：两个 dmg（Apple Silicon / Intel 各一个），到对应 run 的 Artifacts 里下载。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64      # Apple Silicon（M 系列）
          - target: x86_64-apple-darwin
            arch: x86_64     # Intel
    # 两个目标都在 Apple Silicon runner 上交叉编译：x86_64 目标不需要 Rosetta，
    # 也不依赖已陆续下线的 Intel 版 runner。
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build dmg
        run: tauri build --target ${{ matrix.target }} --bundles app,dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: WorkCalf-macos-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
