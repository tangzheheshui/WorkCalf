<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>勤劳的牛牛 · 设置</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #4a3b2e;
      background: #faf6f0;
      overflow: hidden;
    }
    .app { display: flex; height: 100vh; }

    /* ---- 左侧导航 ---- */
    .side {
      width: 168px;
      flex: none;
      display: flex;
      flex-direction: column;
      background: #f2e8db;
      border-right: 1px solid #e7dac9;
      padding: 16px 12px 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 6px 16px;
    }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }
    .brand-t { font-size: 14px; font-weight: 700; line-height: 1.25; }
    .brand-t span {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #a0907c;
      letter-spacing: 0.5px;
    }
    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      all: unset;
      cursor: pointer;
      padding: 9px 12px;
      border-radius: 9px;
      color: #6f5c48;
      font-size: 13.5px;
      position: relative;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.55); }
    .nav-btn.active {
      background: #fffdf9;
      color: #a3472f;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(120, 90, 60, 0.08);
    }
    .nav-btn.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 2px;
      background: #b3543f;
    }
    .side-foot { margin-top: auto; padding: 8px 8px 2px; font-size: 11px; color: #b3a28e; }

    /* ---- 右侧内容 ---- */
    .main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 18px 22px 24px;
    }
    .main::-webkit-scrollbar { width: 8px; }
    .main::-webkit-scrollbar-thumb { background: #e3d5c2; border-radius: 4px; }
    h2 { font-size: 16px; margin: 2px 0 12px; }
    .pane { display: none; }
    .pane.active { display: block; }
    .desc { margin: -4px 0 12px; font-size: 13px; color: #8a7763; }
    .muted { color: #a0907c; font-size: 12px; font-weight: 400; }

    .card {
      background: #fffdf9;
      border: 1px solid #eee0cd;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .row { margin-bottom: 16px; }
    .row:last-child { margin-bottom: 0; }
    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .row-head label { font-size: 13px; color: #7a6a58; }
    .val { font-size: 12px; color: #b3543f; font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: #b3543f; }
    .hint { font-size: 12px; color: #a0907c; margin: 6px 0 0; }

    .check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 0;
      cursor: pointer;
    }
    .check + .check { border-top: 1px dashed #f0e6d8; }
    .check input { margin-top: 4px; accent-color: #b3543f; flex: none; }
    .check b { font-size: 13px; }
    .check .hint { margin-top: 2px; }

    .warn {
      background: #fdeeea;
      border: 1px solid #f2c4ba;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .warn button {
      all: unset;
      color: #b3543f;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ---- 关于 ---- */
    .about-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .about-head img { width: 52px; height: 52px; border-radius: 12px; }
    .about-name { font-size: 17px; font-weight: 700; }
    .kv {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-size: 13px;
      color: #7a6a58;
    }
    .kv + .kv { border-top: 1px dashed #f0e6d8; }
    .kv b { color: #4a3b2e; }
    .foot-note { font-size: 12px; color: #a0907c; margin: 2px 2px 0; }

    /* ---- 意见反馈 ---- */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: #7a6a58; margin-bottom: 6px; }
    input[type="text"], textarea {
      width: 100%;
      border: 1px solid #e3d5c2;
      border-radius: 9px;
      background: #fff;
      color: #4a3b2e;
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      resize: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: #d2a58f; }
    .fb-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .fb-actions .hint { margin: 0; }
    .btn {
      all: unset;
      flex: none;
      padding: 7px 16px;
      border: 1px solid #e3d5c2;
      border-radius: 9px;
      background: #fff;
      color: #4a3b2e;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover { background: #f4e9db; }
    .btn.primary {
      background: #b3543f;
      border-color: #b3543f;
      color: #fff;
      font-weight: 600;
    }
    .btn.primary:hover { background: #a3472f; }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .status { min-height: 20px; margin: 10px 0 0; font-size: 12px; color: #6f8f5f; }
    .status.warn { color: #b3543f; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img src="assets/app-icon.png" alt="" />
        <div class="brand-t">勤劳的牛牛<span>WorkCalf</span></div>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-tab="prefs">偏好</button>
        <button class="nav-btn" data-tab="about">关于</button>
        <button class="nav-btn" data-tab="feedback">意见反馈</button>
      </nav>
      <div class="side-foot">v<span id="side-ver">1.0.0</span> · 纯本地运行</div>
    </aside>

    <main class="main">
      <div id="mac-warn" class="warn" style="display:none">
        未检测到辅助功能权限，无法监听全局键鼠。<br />
        请前往 系统设置 → 隐私与安全性 → 辅助功能 勾选本应用。
        <button id="open-a11y">打开系统设置</button>
      </div>

      <!-- 偏好 -->
      <section class="pane active" id="pane-prefs">
        <h2>偏好</h2>
        <div class="card">
          <div class="row">
            <div class="row-head">
              <label for="scale">显示大小</label>
              <span class="val"><b id="scale-v">0.65</b> 倍</span>
            </div>
            <input type="range" id="scale" min="0.3" max="2" step="0.05" value="0.65" />
            <p class="hint">也可以把鼠标移到小牛身上，直接滚动滚轮缩放。</p>
          </div>
          <div class="row">
            <div class="row-head">
              <label for="opacity">不透明度</label>
              <span class="val"><b id="opacity-v">1.00</b></span>
            </div>
            <input type="range" id="opacity" min="0.2" max="1" step="0.05" value="1" />
          </div>
        </div>

        <div class="card">
          <label class="check">
            <input type="checkbox" id="ct" />
            <span>
              <b>鼠标穿透</b>
              <span class="hint">开启后整个小牛窗口都会穿透到后方窗口，且无法拖拽；可通过系统托盘或本面板关回。</span>
            </span>
          </label>
          <label class="check">
            <input type="checkbox" id="snd" />
            <span>
              <b>音效</b>
              <span class="hint">打字哒哒声 / 木鱼声</span>
            </span>
          </label>
        </div>
      </section>

      <!-- 关于 -->
      <section class="pane" id="pane-about">
        <h2>关于</h2>
        <div class="about-head">
          <img src="assets/app-icon.png" alt="" />
          <div>
            <div class="about-name">勤劳的牛牛</div>
            <div class="muted">WorkCalf · v<span id="app-ver">1.0.0</span></div>
          </div>
        </div>
        <div class="card">
          <div class="kv"><span>版本</span><b>v<span id="about-ver">1.0.0</span></b></div>
          <div class="kv"><span>运行方式</span><span>纯本地运行 · 无需登录</span></div>
          <div class="kv"><span>官网 / 下载</span><span class="muted">即将上线</span></div>
        </div>
        <p class="foot-note">
          除你主动提交反馈外，程序不会发起网络请求；也不会上传任何键鼠记录。
        </p>
      </section>

      <!-- 意见反馈 -->
      <section class="pane" id="pane-feedback">
        <h2>意见反馈</h2>
        <p class="desc">遇到问题、想要新功能，或者单纯想吐槽，都可以写在这里。</p>
        <div class="card">
          <div class="field">
            <label for="fb-contact">联系方式 <span class="muted">（选填，方便回复你）</span></label>
            <input id="fb-contact" type="text" maxlength="120" placeholder="邮箱 / QQ / 微信" />
          </div>
          <div class="field">
            <label for="fb-message">反馈内容</label>
            <textarea id="fb-message" rows="6" maxlength="2000" placeholder="说说你遇到的问题或建议…"></textarea>
          </div>
          <div class="fb-actions">
            <span class="hint">会附带版本号和系统信息，不会上传键鼠记录。</span>
            <button class="btn primary" id="fb-submit">提交反馈</button>
          </div>
          <p id="fb-status" class="status"></p>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="settings.js"></script>
</body>
</html>
