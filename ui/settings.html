<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>勤劳的牛牛 · 设置</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 14px/1.6 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #4a3b2e;
      background: #faf6f0;
      overflow: hidden;
    }
    .app { display: flex; height: 100vh; }

    /* ---- 左侧导航 ---- */
    .side {
      width: 168px;
      flex: none;
      display: flex;
      flex-direction: column;
      background: #f2e8db;
      border-right: 1px solid #e7dac9;
      padding: 16px 12px 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 6px 16px;
    }
    .brand img { width: 34px; height: 34px; border-radius: 9px; }
    .brand-t { font-size: 14px; font-weight: 700; line-height: 1.25; }
    .brand-t span {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: #a0907c;
      letter-spacing: 0.5px;
    }
    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      all: unset;
      cursor: pointer;
      padding: 9px 12px;
      border-radius: 9px;
      color: #6f5c48;
      font-size: 13.5px;
      position: relative;
      transition: background 0.15s;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.55); }
    .nav-btn.active {
      background: #fffdf9;
      color: #a3472f;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(120, 90, 60, 0.08);
    }
    .nav-btn.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 2px;
      background: #b3543f;
    }

    /* ---- 右侧内容 ---- */
    .main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 18px 22px 24px;
    }
    .main::-webkit-scrollbar { width: 8px; }
    .main::-webkit-scrollbar-thumb { background: #e3d5c2; border-radius: 4px; }
    .pane { display: none; }
    .pane.active { display: block; }

    .card {
      background: #fffdf9;
      border: 1px solid #eee0cd;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .row { margin-bottom: 16px; }
    .row:last-child { margin-bottom: 0; }
    .row-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .row-head label { font-size: 13px; color: #7a6a58; }
    .val { font-size: 12px; color: #b3543f; font-weight: 600; }
    input[type="range"] { width: 100%; accent-color: #b3543f; }
    .hint { font-size: 12px; color: #a0907c; margin: 6px 0 0; }

    .check {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 0;
      cursor: pointer;
    }
    .check + .check { border-top: 1px dashed #f0e6d8; }
    .check input { margin-top: 4px; accent-color: #b3543f; flex: none; }
    .check b { font-size: 13px; }
    .check .hint { margin-top: 2px; }

    .warn {
      background: #fdeeea;
      border: 1px solid #f2c4ba;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .warn button {
      all: unset;
      color: #b3543f;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ---- 关于 ---- */
    .kv {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      font-size: 13px;
      color: #7a6a58;
    }
    .kv + .kv { border-top: 1px dashed #f0e6d8; }
    .kv b { color: #4a3b2e; }
    .kv-actions { display: flex; align-items: center; gap: 8px; }

    .empty-box {
      margin-top: 12px;
      padding: 26px 16px;
      border: 1px dashed #e7dac9;
      border-radius: 10px;
      text-align: center;
      font-size: 12.5px;
      color: #a0907c;
    }
    .empty-box b {
      display: block;
      margin-bottom: 4px;
      font-size: 13.5px;
      color: #7a6a58;
    }

    /* ---- 模型选择 ---- */
    .model-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
      gap: 10px;
    }
    .model-card {
      all: unset;
      cursor: pointer;
      border: 1.5px solid #e3d5c2;
      border-radius: 12px;
      background: #fff;
      padding: 12px 8px 10px;
      text-align: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .model-card:hover { border-color: #d2a58f; }
    .model-card.active {
      border-color: #b3543f;
      background: #fdf3ef;
      box-shadow: 0 1px 3px rgba(179, 84, 63, 0.15);
    }
    .model-card canvas {
      display: block;
      width: 88px;
      height: 88px;
      margin: 0 auto 6px;
    }
    .model-card .mname { font-size: 13px; font-weight: 600; color: #4a3b2e; }
    .model-card.active .mname { color: #a3472f; }
    .model-card .mdesc { font-size: 11px; color: #a0907c; margin-top: 1px; }

    /* ---- 意见反馈 ---- */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: #7a6a58; margin-bottom: 6px; }
    input[type="text"], textarea {
      width: 100%;
      border: 1px solid #e3d5c2;
      border-radius: 9px;
      background: #fff;
      color: #4a3b2e;
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      resize: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: #d2a58f; }
    .fb-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }
    .btn {
      all: unset;
      flex: none;
      padding: 7px 16px;
      border: 1px solid #e3d5c2;
      border-radius: 9px;
      background: #fff;
      color: #4a3b2e;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .btn:hover { background: #f4e9db; }
    .btn.primary {
      background: #b3543f;
      border-color: #b3543f;
      color: #fff;
      font-weight: 600;
    }
    .btn.primary:hover { background: #a3472f; }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn.sm { padding: 4px 12px; font-size: 12px; border-radius: 7px; }
    .status { min-height: 20px; margin: 10px 0 0; font-size: 12px; color: #6f8f5f; }
    .status:empty { display: none; }
    .status.warn { color: #b3543f; }

    /* ---- 打赏弹窗 ---- */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal[hidden] { display: none; }
    .modal-mask {
      position: absolute;
      inset: 0;
      background: rgba(74, 59, 46, 0.35);
    }
    .modal-card {
      position: relative;
      background: #fffdf9;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 18px 48px rgba(74, 59, 46, 0.22);
    }
    .qr { margin: 0; text-align: center; }
    .qr[hidden] { display: none; }
    .qr img {
      display: block;
      width: 240px;
      height: 240px;
      object-fit: contain;
      border-radius: 10px;
      background: #fff;
    }
    .qr figcaption { margin-top: 8px; font-size: 12px; color: #8a7763; }
    .modal-close {
      all: unset;
      position: absolute;
      top: -12px;
      right: -12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fffdf9;
      border: 1px solid #e3d5c2;
      color: #8a7763;
      font-size: 18px;
      line-height: 26px;
      text-align: center;
      cursor: pointer;
    }
    .modal-close:hover { color: #b3543f; border-color: #d2a58f; }
    .modal-empty {
      margin: 0;
      width: 220px;
      padding: 60px 0;
      text-align: center;
      font-size: 12px;
      color: #a0907c;
    }
  </style>
</head>
<body>
  <!-- 脚本异常时的兜底提示：避免只看到一片空白不知道发生了什么 -->
  <div id="boot-warn" hidden style="position:fixed;inset:auto 16px 16px 16px;z-index:99;padding:12px 14px;border-radius:10px;background:#fdecea;border:1px solid #f3c2bb;color:#8a3a2c;font-size:12.5px;line-height:1.6">
    设置页没有正常加载。可以关掉窗口再打开一次；如果反复出现，请把
    <code>%TEMP%\workcalf_debug.log</code> 发给作者。
  </div>
  <script>
    // 5 秒内 settings.js 没有跑起来就显示上面的提示
    setTimeout(function () {
      if (!window.__settingsBooted) {
        var el = document.getElementById('boot-warn');
        if (el) el.hidden = false;
      }
    }, 5000);
  </script>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img src="assets/app-icon.png" alt="" />
        <div class="brand-t">勤劳的牛牛<span>WorkCalf</span></div>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-tab="prefs">偏好</button>
        <button class="nav-btn" data-tab="models">模型</button>
        <button class="nav-btn" data-tab="about">关于</button>
        <button class="nav-btn" data-tab="feedback">意见反馈</button>
      </nav>
    </aside>

    <main class="main">
      <div id="mac-warn" class="warn" style="display:none">
        未检测到辅助功能权限，无法监听全局键鼠。<br />
        请前往 系统设置 → 隐私与安全性 → 辅助功能 勾选本应用。
        <button id="open-a11y">打开系统设置</button>
      </div>

      <!-- 偏好 -->
      <section class="pane active" id="pane-prefs">
        <div class="card">
          <div class="row">
            <div class="row-head">
              <label for="scale">显示大小</label>
              <span class="val"><b id="scale-v">0.65</b> 倍</span>
            </div>
            <input type="range" id="scale" min="0.3" max="2" step="0.05" value="0.65" />
            <p class="hint">也可以把鼠标移到小牛身上，直接滚动滚轮缩放。</p>
          </div>
          <div class="row">
            <div class="row-head">
              <label for="opacity">不透明度</label>
              <span class="val"><b id="opacity-v">1.00</b></span>
            </div>
            <input type="range" id="opacity" min="0.2" max="1" step="0.05" value="1" />
          </div>
        </div>

        <div class="card">
          <label class="check">
            <input type="checkbox" id="ct" />
            <span>
              <b>鼠标穿透</b>
              <span class="hint">开启后整个小牛窗口都会穿透到后方窗口，且无法拖拽；可通过系统托盘或本面板关回。</span>
            </span>
          </label>
          <label class="check">
            <input type="checkbox" id="snd" />
            <span>
              <b>音效</b>
              <span class="hint">打字哒哒声 / 木鱼声</span>
            </span>
          </label>
        </div>
      </section>

      <!-- 模型 -->
      <section class="pane" id="pane-models">
        <div class="card">
          <div class="model-grid" id="model-grid"></div>
          <p class="hint">点击卡片即可切换，立即生效，不用重启。</p>
        </div>
        <div class="card">
          <div class="kv"><span>当前模型</span><b id="cur-model">—</b></div>
          <div class="empty-box">
            <b>更多模型还在路上</b>
            Live2D 真实模型等，上架后同样在这里一键切换。
          </div>
        </div>
      </section>

      <!-- 关于 -->
      <section class="pane" id="pane-about">
        <div class="card">
          <div class="kv"><span>版本</span><b>v<span id="about-ver">1.0.0</span></b></div>
          <div class="kv">
            <span>官网 / 下载</span>
            <button class="btn sm" id="open-site">打开官网</button>
          </div>
          <div class="kv">
            <span>更新</span>
            <span class="kv-actions">
              <button class="btn sm" id="check-update">检查更新</button>
              <button class="btn sm primary" id="update-download" style="display:none">去下载</button>
            </span>
          </div>
          <p id="update-status" class="status"></p>
        </div>
      </section>

      <!-- 意见反馈 -->
      <section class="pane" id="pane-feedback">
        <div class="card">
          <div class="field">
            <label for="fb-message">反馈内容</label>
            <textarea id="fb-message" rows="6" maxlength="2000" placeholder="说说你遇到的问题或建议…"></textarea>
          </div>
          <div class="field">
            <label for="fb-contact">联系方式</label>
            <input id="fb-contact" type="text" maxlength="120" placeholder="选填，方便回复你" />
          </div>
          <div class="fb-actions">
            <button class="btn" id="fb-reward">打赏</button>
            <button class="btn primary" id="fb-submit">提交反馈</button>
          </div>
          <p id="fb-status" class="status"></p>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="reward-modal" hidden>
    <div class="modal-mask" id="reward-mask"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="打赏二维码">
      <button class="modal-close" id="reward-close" aria-label="关闭">×</button>
      <figure class="qr">
        <img id="reward-img" src="assets/reward-qr.png" alt="打赏二维码" />
        <figcaption>微信扫码打赏</figcaption>
      </figure>
      <p class="modal-empty" id="reward-empty" hidden>二维码暂未配置</p>
    </div>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
